<header class="showcase-topbar">
	<button
		type="button"
		class="showcase-topbar__menu-toggle"
		aria-label="Toggle navigation"
		(click)="menuToggle.emit()"
	>
		<i class="pi pi-bars"></i>
	</button>

	<a routerLink="/" class="showcase-topbar__title">NGX Prime Default Development Kit</a>

	<div class="showcase-topbar__actions">
		@if (pagePromptService.config()) {
			<p-button
				icon="pi pi-sparkles"
				[text]="true"
				[rounded]="true"
				ariaLabel="Create a page like this one with AI"
				(onClick)="openPagePrompt()"
			/>
		}

		@if (isUikitSection()) {
			<p-button
				icon="pi pi-palette"
				[text]="true"
				[rounded]="true"
				ariaLabel="Design Lab"
				pTooltip="Design Lab"
				tooltipPosition="bottom"
				(onClick)="goToDesignLab()"
			/>

			<p-button
				icon="pi pi-download"
				[text]="true"
				[rounded]="true"
				[disabled]="!designLabState.hasChanges()"
				ariaLabel="Download changed theme config as JSON"
				pTooltip="Download Config"
				tooltipPosition="bottom"
				(onClick)="downloadConfig()"
			/>
		}

		<p-button
			[icon]="dark() ? 'pi pi-sun' : 'pi pi-moon'"
			[text]="true"
			[rounded]="true"
			[ariaLabel]="dark() ? 'Switch to light mode' : 'Switch to dark mode'"
			(onClick)="toggleDarkMode()"
		/>
	</div>

	<sc-page-prompt-dialog [(visible)]="promptDialogVisible" />
</header>
