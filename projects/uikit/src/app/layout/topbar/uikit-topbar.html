<header class="uikit-topbar">
	<button
		type="button"
		class="uikit-topbar__menu-toggle"
		aria-label="Toggle navigation"
		(click)="menuToggle.emit()"
	>
		<i class="pi pi-bars"></i>
	</button>

	<span class="uikit-topbar__title">ngx-prime UI Kit</span>

	<p-button
		class="uikit-topbar__download-config"
		icon="pi pi-download"
		label="Download Config"
		[text]="true"
		[disabled]="!designLabState.hasChanges()"
		ariaLabel="Download changed theme config as JSON"
		(onClick)="downloadConfig()"
	/>

	<p-button
		class="uikit-topbar__theme-toggle"
		[icon]="dark() ? 'pi pi-sun' : 'pi pi-moon'"
		[text]="true"
		[rounded]="true"
		[ariaLabel]="dark() ? 'Switch to light mode' : 'Switch to dark mode'"
		(onClick)="toggleDarkMode()"
	/>
</header>
