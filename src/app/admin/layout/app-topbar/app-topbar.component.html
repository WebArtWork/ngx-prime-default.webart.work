<div class="layout-topbar">
	<div class="layout-topbar-logo-container">
		<button
			class="layout-menu-button layout-topbar-action"
			type="button"
			aria-label="Toggle menu"
			(click)="layoutService.onMenuToggle()"
		>
			<i class="pi pi-bars"></i>
		</button>
		<a class="layout-topbar-logo" routerLink="/admin">
			<i class="pi pi-th-large" style="font-size: 1.75rem; color: var(--primary-color)"></i>
			<span>NGX-PRIME</span>
		</a>
	</div>

	<div class="layout-topbar-actions">
		<div class="layout-config-menu">
			<button
				type="button"
				class="layout-topbar-action"
				[attr.aria-label]="layoutService.isDarkTheme() ? 'Switch to light mode' : 'Switch to dark mode'"
				(click)="toggleDarkMode()"
			>
				<i [ngClass]="{ pi: true, 'pi-moon': layoutService.isDarkTheme(), 'pi-sun': !layoutService.isDarkTheme() }"></i>
			</button>
			<div class="relative">
				<button
					type="button"
					class="layout-topbar-action layout-topbar-action-highlight"
					aria-label="Open theme settings"
					pStyleClass="@next"
					enterFromClass="hidden"
					enterActiveClass="animate-scalein"
					leaveToClass="hidden"
					leaveActiveClass="animate-fadeout"
					[hideOnOutsideClick]="true"
				>
					<i class="pi pi-palette"></i>
				</button>
				<app-configurator />
			</div>
		</div>

		<button
			type="button"
			class="layout-topbar-menu-button layout-topbar-action"
			aria-label="Toggle topbar menu"
			pStyleClass="@next"
			enterFromClass="hidden"
			enterActiveClass="animate-scalein"
			leaveToClass="hidden"
			leaveActiveClass="animate-fadeout"
			[hideOnOutsideClick]="true"
		>
			<i class="pi pi-ellipsis-v"></i>
		</button>

		<div class="layout-topbar-menu hidden lg:block">
			<div class="layout-topbar-menu-content">
				<button type="button" class="layout-topbar-action">
					<i class="pi pi-calendar"></i>
					<span>Calendar</span>
				</button>
				<button type="button" class="layout-topbar-action">
					<i class="pi pi-inbox"></i>
					<span>Messages</span>
				</button>
				<button type="button" class="layout-topbar-action">
					<i class="pi pi-user"></i>
					<span>Profile</span>
				</button>
			</div>
		</div>
	</div>
</div>
